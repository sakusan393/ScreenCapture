name: Store package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up .NET 8
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: 8.0.x

      - name: Build Store submission package
        shell: pwsh
        run: ./scripts/Build-StoreMsix.ps1

      - name: Upload Store package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: store-ScreenCapture-${{ github.run_number }}
          path: |
            artifacts/store/*.msix
            artifacts/store/*.appxsym
            artifacts/store/*.msixupload
            artifacts/store/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
