<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06275e"/>
      <stop offset="1" stop-color="#0874e8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#001637" flood-opacity="0.55"/>
    </filter>
    <clipPath id="screenClip"><rect x="160" y="184" width="1280" height="688" rx="24"/></clipPath>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1455" cy="60" r="250" fill="#5db1ff" opacity="0.16"/>
  <circle cx="80" cy="890" r="280" fill="#001d54" opacity="0.24"/>
  <text x="160" y="76" fill="#ffffff" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="48" font-weight="700">必要な範囲だけ、すばやく選択</text>
  <text x="160" y="124" fill="#d9ecff" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="24">画面をドラッグして範囲を指定。ウィンドウ単位のキャプチャにも対応します。</text>
  <rect x="148" y="172" width="1304" height="712" rx="32" fill="#ffffff" opacity="0.98" filter="url(#shadow)"/>
  <image href="../raw/selection-overlay.png" x="160" y="184" width="1280" height="688" preserveAspectRatio="xMidYMid meet" clip-path="url(#screenClip)"/>
</svg>
