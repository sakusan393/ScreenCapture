<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06275e"/>
      <stop offset="1" stop-color="#0874e8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#001637" flood-opacity="0.55"/>
    </filter>
    <clipPath id="screenClip"><rect x="160" y="156" width="1280" height="720" rx="24"/></clipPath>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1455" cy="60" r="250" fill="#5db1ff" opacity="0.16"/>
  <circle cx="80" cy="890" r="280" fill="#001d54" opacity="0.24"/>
  <text x="160" y="68" fill="#ffffff" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="48" font-weight="700">キャプチャ後、そのまま編集</text>
  <text x="160" y="116" fill="#d9ecff" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="24">テキスト・ペイント・矢印・画像を、ひとつの画面で追加できます。</text>
  <rect x="148" y="144" width="1304" height="744" rx="32" fill="#ffffff" opacity="0.98" filter="url(#shadow)"/>
  <image href="../raw/editor-annotations.png" x="160" y="156" width="1280" height="720" preserveAspectRatio="xMidYMid meet" clip-path="url(#screenClip)"/>
  <rect x="441" y="802" width="718" height="70" rx="14" fill="#071020" opacity="0.30"/>
  <image href="../raw/paint-toolbar.png" x="454" y="807" width="693" height="60" preserveAspectRatio="xMidYMid meet"/>
</svg>
