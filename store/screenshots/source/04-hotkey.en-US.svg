<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06275e"/>
      <stop offset="1" stop-color="#0874e8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#001637" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1455" cy="60" r="250" fill="#5db1ff" opacity="0.16"/>
  <circle cx="80" cy="890" r="280" fill="#001d54" opacity="0.24"/>
  <text x="160" y="76" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="700">Capture instantly with a hotkey</text>
  <text x="160" y="124" fill="#d9ecff" font-family="Segoe UI, Arial, sans-serif" font-size="24">Keep it in the notification area and start a capture anytime with your shortcut.</text>
  <rect x="132" y="190" width="1336" height="630" rx="40" fill="#ffffff" opacity="0.98" filter="url(#shadow)"/>
  <image href="../../../ScreenCapture/icon.png" x="210" y="275" width="430" height="430" preserveAspectRatio="xMidYMid meet"/>
  <rect x="752" y="252" width="650" height="506" rx="26" fill="#eef5ff"/>
  <image href="../raw/hotkey-settings.png" x="817" y="287" width="520" height="397" preserveAspectRatio="xMidYMid meet"/>
  <text x="1077" y="728" text-anchor="middle" fill="#0a326a" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Ctrl + Shift + P</text>
</svg>
