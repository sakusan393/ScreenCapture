<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff" />
      <stop offset="1" stop-color="#e8f2ff" />
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0874ed" />
      <stop offset="1" stop-color="#0245b9" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#17345f" flood-opacity="0.14" />
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#background)" />
  <circle cx="1470" cy="90" r="220" fill="#cbe4ff" opacity="0.65" />
  <circle cx="80" cy="860" r="250" fill="#dcecff" opacity="0.8" />

  <text x="100" y="110" fill="#0a2b59" font-family="Segoe UI, sans-serif" font-size="34" font-weight="700">DESIGN REVIEW</text>
  <text x="100" y="158" fill="#5b7192" font-family="Segoe UI, sans-serif" font-size="22">Select an area, then add clear visual feedback.</text>

  <g filter="url(#shadow)">
    <rect x="90" y="210" width="920" height="570" rx="34" fill="#ffffff" />
    <rect x="90" y="210" width="920" height="112" rx="34" fill="url(#hero)" />
    <rect x="90" y="280" width="920" height="42" fill="url(#hero)" />
    <text x="150" y="280" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="34" font-weight="700">Summer campaign concept</text>

    <rect x="150" y="375" width="800" height="325" rx="24" fill="#eaf6ff" />
    <circle cx="810" cy="445" r="54" fill="#ffca42" />
    <path d="M150 650 L330 480 L470 590 L630 410 L810 600 L950 500 L950 700 L150 700 Z" fill="#62b5f4" />
    <path d="M150 700 L350 540 L520 660 L700 505 L950 680 L950 700 Z" fill="#1769d2" />
    <path d="M565 485 L630 410 L700 505 L663 488 L630 515 L606 482 Z" fill="#ffffff" />
  </g>

  <g filter="url(#shadow)">
    <rect x="1060" y="210" width="440" height="170" rx="28" fill="#ffffff" />
    <circle cx="1130" cy="275" r="28" fill="#0874ed" />
    <text x="1121" y="285" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="25" font-weight="700">A</text>
    <text x="1185" y="268" fill="#17345f" font-family="Segoe UI, sans-serif" font-size="25" font-weight="700">Layout</text>
    <text x="1185" y="310" fill="#667d9c" font-family="Segoe UI, sans-serif" font-size="20">Check balance and spacing</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1060" y="410" width="440" height="170" rx="28" fill="#ffffff" />
    <circle cx="1130" cy="475" r="28" fill="#ff3b30" />
    <text x="1121" y="485" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="25" font-weight="700">B</text>
    <text x="1185" y="468" fill="#17345f" font-family="Segoe UI, sans-serif" font-size="25" font-weight="700">Copy</text>
    <text x="1185" y="510" fill="#667d9c" font-family="Segoe UI, sans-serif" font-size="20">Add a concise annotation</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1060" y="610" width="440" height="170" rx="28" fill="#ffffff" />
    <circle cx="1130" cy="675" r="28" fill="#38b86f" />
    <text x="1121" y="685" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="25" font-weight="700">C</text>
    <text x="1185" y="668" fill="#17345f" font-family="Segoe UI, sans-serif" font-size="25" font-weight="700">Export</text>
    <text x="1185" y="710" fill="#667d9c" font-family="Segoe UI, sans-serif" font-size="20">Copy or save as PNG</text>
  </g>
</svg>
